name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify app imports
        run: |
          python -c "from app import __version__; print(f'App version: {__version__}')"
          python -c "from app.config import COLLECTION_NAME; print(f'Config loaded: {COLLECTION_NAME}')"
          python -c "from app.ingestion import parse_markdown, chunk_text; print('Ingestion module OK')"
          python -c "from app.generator import is_policy_question; print('Generator module OK')"
          python -c "from app.web import create_app; app = create_app(); print('Flask app created OK')"

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short
        env:
          OPENROUTER_API_KEY: "test-key-not-real"

      - name: Health check smoke test
        run: |
          python -c "
          from app.web import create_app
          app = create_app()
          client = app.test_client()
          resp = client.get('/health')
          assert resp.status_code == 200
          data = resp.get_json()
          assert data['status'] == 'healthy'
          print('Health check passed!')
          "
